<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day5</title>
</head> 
<body style="text-align: center;">
<h1>1. Job Application Form</h1>


    <label for="full name">full name</label>
    <input  type="text" id="full name" name="full name"> 
    <br> <br>
  
    <label for="email">email</label>
    <input  type="email" id="email" name="email"> 
    <br> <br>

    <label for="phone no">phone number</label>
    <input type="tel" id="phone no" name="phone no"> 
    <br> <br>

    <label for="dob">date of birth</label>
    <input type="date" id="dob" name="dob"> 
    <br> <br>

    <label for="gender">gender</label>
<input type="radio" id="gender" name="gender" value="male">male
<input type="radio" id="gender" name="gender" value="female">female
 <br>
<br>


<label for="qualification">qualification</label>
<select id="qualification" name="qualification">
    <option value="">select qualification</option>
    <option value="btech">btech</option>
    <option value="b.E">b.E</option>
    <option value="diploma">diploma</option>
    <option value="B.Sc">B.Sc</option>
    <option value="BCOM">BCOM</option>
</select>
    <br> 
<br>
<br>

<label for="skills">skills</label>
<input type="checkbox" id="skills" name="skills" value="html">html
<input type="checkbox" id="skills" name="skills" value="css">css
<input type="checkbox" id="skills" name="skills" value="javascript">javascript
<br>
<br>

<label for="Years of Experience">Years of Experience</label>
<input type="number" id="Years of Experience" name="Years of Experience" min="0" max="2" step="1">
<br>
<br>

<label for="resume">resume</label>
<input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
<br>
<br>

<label for="address">address</label>
<textarea id="address" name="address" rows="5" cols="10" spellcheck="true"></textarea>
<br>
<br>

<label for="location">Preferred Job Location</label>
<select id="location" name="location">
    <option value="">select location</option>
    <option value="bangalore">bangalore</option>
    <option value="chennai">chennai</option>
    <option value="hyderabad">hyderabad</option>
    <option value="pune">pune</option>
    <option value="mumbai">mumbai</option>
</select>
<br>
<br>

<label for="password">password</label>
<input type="password" id="password" name="password">
<br>
<br>

<label for="Agree to Terms">Agree to Terms</label>
<input type="checkbox" id="Agree to Terms" name="Agree to Terms">
<br>
<br>
<input type="submit" value="submit">
<input type="reset" value="reset">
